# =============================================================================
# rally 전 서비스 공통 설정 (config-server native 백엔드가 모든 클라이언트에 병합)
# 서비스별 설정은 같은 디렉토리의 {application-name}.yml 이 이 파일 위로 오버라이드한다.
# 실제 자격증명/시크릿은 절대 커밋하지 않는다(public repo) — 환경변수로 주입.
# =============================================================================

# dev 기본 = localhost. 운영은 prod 프로파일(application-prod.yml)이 홈서버 IP 로 오버라이드한다.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:18861/eureka/}

# JWT — 발급(user-service)·검증(gateway)이 동일 값을 공유해야 한다. 운영 값은 환경변수로 주입.
jwt:
  secret: ${JWT_SECRET:rally-local-dev-secret-please-change-in-production-0123456789}
  issuer: ${JWT_ISSUER:rally}

spring:
  # JPA 공통 — JPA 를 안 쓰는 모듈(gateway 등)에서는 무시된다.
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  # Flyway 스키마 마이그레이션 — db/migration 의 V__*.sql 적용. DataSource 가 없는 모듈에선 비활성.
  # 마이그레이션으로 스키마를 완전히 잡으면 위 ddl-auto 를 validate/none 으로 내리는 것을 권장.
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
