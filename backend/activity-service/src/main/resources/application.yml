server:
  port: 18802

spring:
  application:
    name: activity-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:rally_activity;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:18861/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
