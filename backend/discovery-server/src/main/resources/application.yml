server:
  port: 18861

spring:
  application:
    name: discovery-server

# 단일 노드 Eureka: 자기 자신은 레지스트리에 등록/페치하지 않는다.
# dev 기본 = localhost. 운영은 prod 프로파일이 홈서버 IP 로 자기 자신을 광고한다.
eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
# prod 프로파일 — 다른 머신의 클라이언트가 이 호스트로 등록 정보를 받으므로 실제 접근 가능한 IP 를 광고한다.
spring:
  config:
    activate:
      on-profile: prod
eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:210.121.177.150}
