server:
  port: 18800

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**,/api/users/**
            - id: activity-service
              uri: lb://activity-service
              predicates:
                - Path=/api/activities/**
            - id: group-service
              uri: lb://group-service
              predicates:
                - Path=/api/groups/**

# 발급(user-service)과 동일해야 함. 운영 값은 환경변수로 주입.
jwt:
  secret: ${JWT_SECRET:rally-local-dev-secret-please-change-in-production-0123456789}
  issuer: ${JWT_ISSUER:rally}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:18861/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
