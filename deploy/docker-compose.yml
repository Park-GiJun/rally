# rally 배포 (홈서버 — 공유 infra-net 위에 rally 서비스만 올린다)
# 내부 서비스(config/discovery/user/activity/group)는 rally-net 전용, gateway·web 만 호스트 노출.
# 실행:  docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
# 서비스 1개만 교체:  docker compose -f deploy/docker-compose.yml up -d --no-deps <service>
name: rally

x-backend-build: &backend-build
  context: ../backend
  dockerfile: Dockerfile

services:
  # ── 중앙 설정 (config-repo/ 를 볼륨으로 읽는다 — 설정 변경 시 재빌드 불필요) ──
  config-server:
    build: { <<: *backend-build, args: { MODULE: config-server } }
    image: rally-config-server
    environment:
      CONFIG_REPO_LOCATION: file:/config-repo
    volumes:
      - ../config-repo:/config-repo:ro
    networks: [rally-net]
    restart: unless-stopped

  # ── 서비스 레지스트리 ──
  discovery-server:
    build: { <<: *backend-build, args: { MODULE: discovery-server } }
    image: rally-discovery-server
    environment:
      CONFIG_SERVER_URL: http://config-server:18859
    networks: [rally-net]
    depends_on: [config-server]
    restart: unless-stopped

  # ── 외부 진입점 (호스트 노출) ──
  gateway:
    build: { <<: *backend-build, args: { MODULE: gateway } }
    image: rally-gateway
    environment:
      CONFIG_SERVER_URL: http://config-server:18859
      EUREKA_URL: http://discovery-server:18861/eureka/
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-rally}
    ports:
      - "18800:18800"
    networks: [rally-net]
    depends_on: [config-server, discovery-server]
    restart: unless-stopped

  # ── 인증 (JWT 발급) ──
  user-service:
    build: { <<: *backend-build, args: { MODULE: user-service } }
    image: rally-user-service
    environment:
      CONFIG_SERVER_URL: http://config-server:18859
      EUREKA_URL: http://discovery-server:18861/eureka/
      DB_URL: jdbc:postgresql://infra-postgres:5432/rally
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-rally}
      JWT_VALIDITY_MINUTES: ${JWT_VALIDITY_MINUTES:-1440}
    networks: [rally-net, infra-net]
    depends_on: [config-server, discovery-server]
    restart: unless-stopped

  # ── 활동 코어 ──
  activity-service:
    build: { <<: *backend-build, args: { MODULE: activity-service } }
    image: rally-activity-service
    environment:
      CONFIG_SERVER_URL: http://config-server:18859
      EUREKA_URL: http://discovery-server:18861/eureka/
      DB_URL: jdbc:postgresql://infra-postgres:5432/rally
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    networks: [rally-net, infra-net]
    depends_on: [config-server, discovery-server]
    restart: unless-stopped

  # ── 그룹 ──
  group-service:
    build: { <<: *backend-build, args: { MODULE: group-service } }
    image: rally-group-service
    environment:
      CONFIG_SERVER_URL: http://config-server:18859
      EUREKA_URL: http://discovery-server:18861/eureka/
      DB_URL: jdbc:postgresql://infra-postgres:5432/rally
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    networks: [rally-net, infra-net]
    depends_on: [config-server, discovery-server]
    restart: unless-stopped

  # ── 웹 (정적 빌드 → nginx, 호스트 노출) ──
  web:
    build:
      context: ../client/web
      dockerfile: Dockerfile
    image: rally-web
    ports:
      - "13100:80"
    networks: [rally-net]
    depends_on: [gateway]
    restart: unless-stopped

networks:
  # rally 전용 내부 네트워크
  rally-net:
    name: rally-net
  # 공유 인프라(PostgreSQL/Redis/Kafka)가 사는 외부 네트워크 — 미리 존재해야 한다.
  infra-net:
    external: true
